<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ロイヤルトラスト 社内システム</title>
    <!--
      Boot screen: Tailwind / index.css 読み込み前の FOUC（素 HTML 表示）を防ぐ。
      React mount で #root の中身は React に置き換わる。
      base 色は index.css の body と一致させる。
    -->
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
        background: #f6f7f9;
        color: #1f2937;
      }
      .__boot {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-size: 14px;
        color: #9ca3af;
      }
      .__boot-dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #c7d2fe;
        margin: 0 3px;
        animation: __boot-bounce 1s infinite ease-in-out;
      }
      .__boot-dot:nth-child(2) { animation-delay: 0.15s; }
      .__boot-dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes __boot-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.6; }
        40% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="__boot">
        <span class="__boot-dot"></span>
        <span class="__boot-dot"></span>
        <span class="__boot-dot"></span>
        <span style="margin-left:10px;">読み込み中...</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
